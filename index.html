<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;background:#111;display:flex;justify-content:center;align-items:center;height:100vh}
.piano{display:flex}
.white{width:60px;height:250px;background:white;border:1px solid #000;border-radius:0 0 8px 8px}
.white:active{background:#ddd}
.black{width:40px;height:150px;background:black;margin-left:-20px;margin-right:-20px;z-index:2;border-radius:0 0 6px 6px}
.black:active{background:#333}
</style>
</head>
<body>
<div class="piano">
<div class="white" onclick="play(261)"></div>
<div class="black" onclick="play(277)"></div>
<div class="white" onclick="play(293)"></div>
<div class="black" onclick="play(311)"></div>
<div class="white" onclick="play(329)"></div>
<div class="white" onclick="play(349)"></div>
<div class="black" onclick="play(369)"></div>
<div class="white" onclick="play(392)"></div>
</div>
<script>
function play(f){
let a=new (window.AudioContext||window.webkitAudioContext)();
let o=a.createOscillator();o.frequency.value=f;o.connect(a.destination);o.start();setTimeout(()=>o.stop(),500)
}
</script>
</body>
</html>
