<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
  margin:0;
  height:100vh;
  background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.85)), url('https://images.unsplash.com/photo-1511379938547-c1f69419868d');
  background-size: cover;
  background-position: center;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-family: sans-serif;
  color:white;
}
h1 {
  font-size:32px;
  margin-bottom:10px;
  text-shadow:0 2px 10px black;
}
.piano {
  display:flex;
  margin-top:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.8);
}
.white { width:40px; height:150px; background:white; border:1px solid #333; border-radius:0 0 5px 5px; }
.black { width:25px; height:90px; background:black; margin-left:-13px; margin-right:-13px; z-index:2; border-radius:0 0 3px 3px; }
.white:active { background:#ddd; }
.black:active { background:#444; }
.home-btn {
  margin-top:30px;
  padding:12px 30px;
  background:#ffcc00;
  color:black;
  border:none;
  border-radius:25px;
  font-weight:bold;
  font-size:16px;
}
</style>
</head>
<body>
<h1>🎹 My Piano</h1>
<p>Beautiful background at home</p>
<div class="piano">
  <div class="white"></div><div class="black"></div><div class="white"></div><div class="black"></div><div class="white"></div><div class="white"></div><div class="black"></div><div class="white"></div><div class="black"></div><div class="white"></div><div class="black"></div><div class="white"></div>
</div>
<button class="home-btn">Play Now</button>
</body>
</html>
